# GHOST-HUNT // x0rTr0n — Project Configuration
# Ruff (linter + formatter) and Pyright (type checker) settings

[tool.ruff]
target-version = "py37"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long — handled by formatter
    "T201",   # print found — intentional in C2 tooling
    "S101",   # assert used — fine in tests
    "S603",   # subprocess call — intentional in harness
    "S607",   # partial executable path — intentional
]

[tool.ruff.lint.per-file-ignores]
"**/test/**" = ["S101", "S106"]
"**/test_*.py" = ["S101", "S106"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.6"
typeCheckingMode = "basic"
include = [
    "GHOST-HUNT-C2-KIT/*.py",
    "GHOST-HUNT-C2-KIT-DNS/*.py",
]
exclude = [
    "**/test/**",
    "**/__pycache__/**",
]
reportMissingImports = false  # cryptography is optional, imported lazily
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportPrivateUsage = false
reportUntypedFunctionDecorator = false
reportIncompatibleMethodOverride = false  # BaseHTTPRequestHandler.log_message override
